name: checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e '.[dev,ui]'
      - run: python -m pytest -q
      - run: python -m ruff check src tests training evaluation
      - run: python -m ruff format --check src tests training evaluation
      - run: python -m compileall -q src training evaluation
