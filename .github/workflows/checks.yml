name: checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e '.[dev,ui,platform]'
      - run: python -m pytest -q
      - run: python -m ruff check src tests training evaluation
      - run: python -m ruff format --check src tests training evaluation
      - run: python -m compileall -q src training evaluation

  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[platform,dev]' playwright==1.51.0
      - run: python -m playwright install --with-deps chromium
      - run: python tests/browser/smoke.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: studio-browser-screenshots
          path: test-results/

  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: studio
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: studio_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U studio -d studio_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[platform,dev]'
      - run: python -m pytest tests/test_platform.py -q
        env:
          TEST_DATABASE_URL: postgresql+psycopg://studio:ci-only-password@localhost:5432/studio_test
