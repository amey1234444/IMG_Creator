[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "img-creator"
version = "0.2.0"
description = "Local FLUX Klein image studio with reproducible exports and dataset tooling"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1", "pillow>=10.4,<13", "pydantic>=2.9,<3",
  "python-dotenv>=1,<2", "numpy>=1.26,<3", "uvicorn>=0.30,<1"
]

[project.optional-dependencies]
inference = [
  "torch>=2.5,<3", "accelerate>=1,<2", "transformers>=4.57,<6",
  "diffusers @ git+https://github.com/huggingface/diffusers.git@031b2798addadd1652db7cfba50eacc1079245cf",
  "huggingface-hub>=0.34,<2", "safetensors>=0.4,<1", "peft>=0.17,<1"
]
ui = ["gradio>=6,<7"]
upscale = ["spandrel>=0.4,<1", "torch>=2.5,<3"]
training = ["datasets>=3,<5", "peft>=0.17,<1", "tensorboard>=2.18,<3", "torchvision>=0.20,<1"]
dev = ["pytest>=8,<10", "httpx>=0.27,<1", "ruff>=0.8,<1"]

[project.scripts]
img-creator-ui = "img_creator.ui:main"
img-creator-api = "img_creator.api:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
